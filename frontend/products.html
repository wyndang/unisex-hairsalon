<!-- products.html -->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Chăm Sóc - UNISEX Salon</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/cart.css?v=2">
    <style>
        .shop-header {
            text-align: center;
            padding: 3.5rem 5%;
            border-bottom: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.4);
        }

        .shop-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 2rem;
            padding: 3rem 5%;
        }

        .filter-sidebar {
            background: rgba(32, 32, 43, 0.8);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            height: fit-content;
        }

        .filter-group h4 {
            color: var(--gold);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .filter-item {
            display: block;
            margin-bottom: 0.5rem;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .shop-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html#home" class="logo">
            <h2>UNISEX</h2><span>BEAUTY & HAIR SALON</span>
        </a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home" class="nav-item">Home</a></li>
                <li><a href="services.html" class="nav-item">Services</a></li>
                <li><a href="products.html" class="nav-item active">Shop</a></li>
                <li><a href="index.html#about" class="nav-item">About</a></li>
                <li><a href="index.html#contact" class="nav-item">Contact</a></li>
            </ul>
        </nav>
        <div class="nav-actions" id="auth-section">
            <a href="login.html" class="account-link">Đăng nhập</a>
            <a href="booking.html" class="btn-primary">Book an Appointment</a>
        </div>
    </header>

    <div class="shop-header">
        <h1 style="color: var(--gold); font-size: 2.8rem;">Sản Phẩm Chăm Sóc Chính Hãng</h1>
        <p style="color: var(--text-muted);">30 dòng sản phẩm cao cấp được phân phối trực tiếp từ Salon</p>
        <div class="search-container-center" style="margin-top:1.5rem;">
            <input type="text" id="searchInput" class="search-box-centered"
                placeholder="🔍 Tìm kiếm dầu gội, sáp vuốt tóc, thương hiệu..." onkeyup="applyFilters()">
        </div>
    </div>

    <div class="shop-container">
        <aside class="filter-sidebar">
            <div class="filter-group" style="margin-bottom: 2rem;">
                <h4>Loại Sản Phẩm</h4>
                <label class="filter-item"><input type="checkbox" value="Dầu gội" class="type-filter"
                        onchange="applyFilters()"> Dầu gội</label>
                <label class="filter-item"><input type="checkbox" value="Dầu xả" class="type-filter"
                        onchange="applyFilters()"> Dầu xả</label>
                <label class="filter-item"><input type="checkbox" value="Dầu dưỡng" class="type-filter"
                        onchange="applyFilters()"> Dầu dưỡng</label>
                <label class="filter-item"><input type="checkbox" value="Sáp vuốt tóc" class="type-filter"
                        onchange="applyFilters()"> Sáp vuốt tóc</label>
                <label class="filter-item"><input type="checkbox" value="Kem ủ & Huyết thanh" class="type-filter"
                        onchange="applyFilters()"> Kem ủ & Huyết thanh</label>
            </div>
            <div class="filter-group">
                <h4>Thương Hiệu</h4>
                <label class="filter-item"><input type="checkbox" value="Moroccanoil" class="brand-filter"
                        onchange="applyFilters()"> Moroccanoil</label>
                <label class="filter-item"><input type="checkbox" value="Olaplex" class="brand-filter"
                        onchange="applyFilters()"> Olaplex</label>
                <label class="filter-item"><input type="checkbox" value="Kevin Murphy" class="brand-filter"
                        onchange="applyFilters()"> Kevin Murphy</label>
                <label class="filter-item"><input type="checkbox" value="Kérastase" class="brand-filter"
                        onchange="applyFilters()"> Kérastase</label>
                <label class="filter-item"><input type="checkbox" value="L'Oréal" class="brand-filter"
                        onchange="applyFilters()"> L'Oréal</label>
                <label class="filter-item"><input type="checkbox" value="Davines" class="brand-filter"
                        onchange="applyFilters()"> Davines</label>
            </div>
        </aside>

        <main>
            <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                <span id="product-count">Đang tải sản phẩm...</span>
                <select id="sortSelect" class="form-control" style="width: auto; padding: 8px 15px;"
                    onchange="applyFilters()">
                    <option value="default">Sắp xếp: Mặc định</option>
                    <option value="price-asc">Giá: Thấp đến Cao</option>
                    <option value="price-desc">Giá: Cao đến Thấp</option>
                    <option value="name-asc">Tên: A - Z</option>
                    <option value="sold-desc">Bán chạy nhất</option>
                    <option value="rating-desc">Đánh giá cao nhất</option>
                </select>
            </div>
            <div class="products-grid" id="main-products-container"></div>
        </main>
    </div>

    <script src="js/cart.js?v=2"></script>
    <script src="js/products.js?v=2"></script>
</body>

</html>
