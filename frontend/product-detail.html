<!-- product-detail.html -->
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm - UNISEX Salon</title>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="css/cart.css?v=2">
    <style>
        .product-detail-container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 5%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            height: 480px;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .slider-images {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.4s ease-in-out;
        }

        .slider-images img {
            min-width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 1.3rem;
            border-radius: 50%;
            z-index: 10;
        }

        .slider-btn.prev {
            left: 10px;
        }

        .slider-btn.next {
            right: 10px;
        }

        .product-info h1 {
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .info-block {
            background: rgba(32, 32, 43, 0.8);
            padding: 1.2rem;
            border-radius: 8px;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border-color);
        }

        .reviews-section {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem 5%;
            background: rgba(32, 32, 43, 0.8);
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .review-card {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            .product-detail-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html#home" class="logo">
            <h2>UNISEX</h2><span>BEAUTY & HAIR SALON</span>
        </a>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home" class="nav-item">Home</a></li>
                <li><a href="services.html" class="nav-item">Services</a></li>
                <li><a href="products.html" class="nav-item active">Shop</a></li>
            </ul>
        </nav>
        <div class="nav-actions" id="auth-section">
            <a href="products.html" class="btn-outline">❮ Quay lại Shop</a>
        </div>
    </header>

    <div class="product-detail-container">
        <div class="slider-wrapper">
            <button class="slider-btn prev" onclick="moveSlide(-1)">❮</button>
            <div class="slider-images" id="slider-track"></div>
            <button class="slider-btn next" onclick="moveSlide(1)">❯</button>
        </div>
        <div class="product-info">
            <p id="p-meta" style="color:var(--text-muted); margin-bottom:0.5rem;"></p>
            <h1 id="p-name">Đang tải...</h1>
            <div id="p-stats"></div>
            <div style="color:var(--gold); font-size: 1.8rem; font-weight:bold; margin: 1rem 0;" id="p-price">0 đ</div>
            <div class="pd-buy-row">
                <div class="qty-stepper">
                    <button type="button" onclick="changeQty(-1)">−</button>
                    <input type="number" id="d-qty" value="1" min="1" onchange="changeQty(0)">
                    <button type="button" onclick="changeQty(1)">+</button>
                </div>
                <span id="p-stock" class="pd-stock"></span>
            </div>
            <button class="btn-primary" style="width: 100%; margin-bottom: 1.5rem;" onclick="addToCartCurrent()">🛒 Thêm
                vào giỏ hàng</button>

            <div class="info-block">
                <h4 style="color:var(--gold); margin-bottom:0.4rem;">Mô tả công dụng</h4>
                <p id="p-desc" style="color:var(--text-light);"></p>
            </div>
            <div class="info-block">
                <h4 style="color:var(--gold); margin-bottom:0.4rem;">Xuất xứ & Hướng dẫn sử dụng</h4>
                <p style="color:var(--text-light);"><strong>Xuất xứ:</strong> <span id="p-origin"></span></p>
                <p style="color:var(--text-light); margin-top:0.4rem;"><strong>Cách dùng:</strong> <span
                        id="p-usage"></span></p>
            </div>
        </div>
    </div>

    <div class="reviews-section">
        <h3 style="color:var(--gold); margin-bottom:1rem;">Đánh Giá Từ Khách Hàng (<span id="avg-rating">5.0</span> ★ -
            <span id="total-reviews">0 đánh giá</span>)
        </h3>
        <div id="reviews-list" style="margin-bottom:1.5rem;"></div>

        <div id="review-notice" class="review-notice">Đang kiểm tra quyền đánh giá...</div>

        <form id="review-form" onsubmit="submitReview(event)" style="display:none;">
            <h4 style="margin-bottom:0.8rem;">Viết đánh giá của bạn</h4>
            <select id="review-stars" class="form-control" style="max-width:200px; margin-bottom:0.8rem;">
                <option value="5">★★★★★ (5 sao)</option>
                <option value="4">★★★★☆ (4 sao)</option>
                <option value="3">★★★☆☆ (3 sao)</option>
                <option value="2">★★☆☆☆ (2 sao)</option>
                <option value="1">★☆☆☆☆ (1 sao)</option>
            </select>
            <textarea id="review-text" class="form-control" rows="3" required
                placeholder="Chia sẻ cảm nhận về sản phẩm..." style="margin-bottom:0.8rem;"></textarea>
            <button type="submit" class="btn-primary">Gửi đánh giá</button>
        </form>
    </div>

    <script src="js/cart.js?v=2"></script>
    <script src="js/detail.js?v=2"></script>
</body>

</html>
